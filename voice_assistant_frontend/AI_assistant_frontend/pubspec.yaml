name: ai_assistant_frontend
description: "Virasoi Kitchen Assistant - AI powered cooking companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Networking & Auth
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  flutter_secure_storage: ^9.0.0

  # Animation
  rive: ^0.13.13
  shimmer: ^3.0.0

  # Images
  cached_network_image: ^3.3.1

  # Voice - Speech to Text / Text to Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.1
  uuid: ^4.4.0
  audioplayers: ^6.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/rive/
    - assets/images/
